<!doctype html>
<html lang="zh-CN" class="prototype-background">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="ComicPerfect 漫画创作工作台交互设计原型。独立演示，不调用生成接口或写入现有项目。"
    />
    <meta name="theme-color" content="#f3f5f8" />
    <title>ComicPerfect · 工作台设计原型</title>
    <link rel="icon" href="/assets/favicon.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./prototype.css" />
    <script type="module" src="./prototype.js"></script>
  </head>
  <body class="minimal-workspace">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="ComicPerfect 原型首页"
        ><span class="brand-symbol" aria-hidden="true"
          ><span></span><span></span><span></span></span
        >ComicPerfect</a
      >
      <span class="top-divider"></span>
      <button
        class="project-button"
        id="project-menu-button"
        aria-haspopup="dialog"
      >
        <span id="project-name">森林里的来信</span
        ><span class="down-chevron" aria-hidden="true">›</span>
      </button>
      <span class="save-status" id="save-status">修改保留在本次演示</span>
      <div class="top-actions">
        <span
          class="prototype-badge"
          title="不调用 AI，不读写真实项目；刷新重置"
          >演示稿</span
        >
        <button
          class="icon-button"
          data-action="more"
          aria-label="更多操作"
          aria-haspopup="dialog"
        >
          <span data-icon="more"></span>
        </button>
        <button class="outline-button" data-action="export">
          <span data-icon="export"></span>导出<span
            class="down-chevron"
            aria-hidden="true"
            >›</span
          >
        </button>
      </div>
    </header>
    <div class="workspace">
      <main class="main-workspace">
        <div class="canvas-toolbar">
          <h1 class="page-context" id="page-subtitle">来信</h1>
          <div class="view-switch" role="group" aria-label="画布视图">
            <button id="script-view" aria-pressed="true">分镜脚本</button
            ><button id="image-view" aria-pressed="false">漫画成图</button>
          </div>
          <div class="toolbar-actions">
            <button class="primary-button" id="generate-page">
              <span data-icon="spark"></span
              ><span id="generate-label">生成本页</span>
            </button>
          </div>
        </div>
        <div class="canvas-area" id="canvas-area">
          <section
            class="comic-sheet"
            id="comic-sheet"
            aria-label="当前页分镜"
          ></section>
        </div>
        <div class="canvas-bottom">
          <div class="pagination" aria-label="页面切换">
            <button class="icon-button" id="previous-page" aria-label="上一页">
              <span data-icon="left"></span>
            </button>
            <select id="page-select" aria-label="切换页面"></select>
            <button class="icon-button" id="next-page" aria-label="下一页">
              <span data-icon="right"></span>
            </button>
          </div>
          <div class="zoom-controls">
            <button class="icon-button" id="zoom-out" aria-label="缩小预览">
              −</button
            ><button
              class="quiet-button"
              id="zoom-reset"
              aria-label="恢复适应画布"
            >
              适应画布</button
            ><button class="icon-button" id="zoom-in" aria-label="放大预览">
              +
            </button>
          </div>
        </div>
        <footer class="taskbar">
          <div class="task-summary">
            <span class="task-indicator" aria-hidden="true"></span>
            <div>
              <strong id="task-title">让故事，从分镜走向画面</strong
              ><span id="task-description">2 页已成图，4 页待生成</span>
            </div>
          </div>
        </footer>
      </main>
      <aside class="inspector" id="inspector" aria-label="上下文编辑面板">
        <div class="inspector-heading">
          <span>属性编辑</span
          ><button
            class="icon-button close-inspector"
            id="inspector-close"
            aria-label="关闭属性编辑"
          >
            ×</button
          ><span class="small-tag"
            >第 <span id="inspector-page">02</span> 页</span
          >
        </div>

        <section class="panel-editor">
          <div class="section-heading">
            <h2 id="panel-heading">第 02 格</h2>
          </div>
          <label class="field-label" for="panel-text">分镜描述</label
          ><textarea id="panel-text" rows="9" spellcheck="false"></textarea>
          <div class="editor-meta">
            <span>演示内自动同步</span><span id="character-count"></span>
          </div>
          <div class="editor-note" id="editor-note">
            <span data-icon="info"></span>
            <p>先打磨分镜，再生成画面。<br />修改不会自动消耗生成额度。</p>
          </div>
        </section>
        <button class="outline-button editor-done" id="editor-done">
          完成编辑
        </button>
      </aside>
    </div>

    <dialog id="workspace-dialog" aria-labelledby="dialog-title">
      <div class="dialog-top">
        <div>
          <span class="dialog-eyebrow">ComicPerfect / 设计原型</span>
          <h2 id="dialog-title"></h2>
        </div>
        <button class="icon-button" id="dialog-close" aria-label="关闭弹窗">
          ×
        </button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
  </body>
</html>
